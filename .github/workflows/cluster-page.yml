name: Update cluster page

on:
  schedule:
    - cron: "0 10 * * *"   # every day at 10:00 UTC (5–6 AM Eastern), after the nightly import
  workflow_dispatch:        # "Run workflow" button for a manual update

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Build cluster data from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: appk5Pi5OJRT6VtTv
        run: python scripts/build_clusters.py
      - name: Save the data file if it changed
        run: |
          git config user.name "cluster-page-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/clusters.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update cluster data"
            git push
          fi
